name: Release Build (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload assets"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config fakeroot rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Upload AppImage, deb, rpm to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          for dir in appimage deb rpm; do
            for f in "$BUNDLE_DIR/$dir/"*; do
              [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
            done
          done

      - name: Package tar.gz and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          mkdir -p dist-targz

          BIN_PATH="src-tauri/target/release/docker-native-manager"
          if [ ! -f "$BIN_PATH" ]; then
            echo "Expected binary not found at $BIN_PATH"
            exit 1
          fi

          PKG_VERSION="${TAG#v}"

          cp "$BIN_PATH" dist-targz/
          cp LICENSE dist-targz/

          TAR_GZ="Docker.Native.Manager_${PKG_VERSION}_amd64.tar.gz"
          tar -C dist-targz -czf "$TAR_GZ" docker-native-manager LICENSE

          gh release upload "$TAG" "$TAR_GZ" --clobber
