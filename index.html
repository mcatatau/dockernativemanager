<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docker Native Manager</title>
    <style>
      :root {
        --background: hsl(0 0% 100%);
        --foreground: hsl(222.2 84% 4.9%);
        --card: hsl(0 0% 100%);
        --card-border: hsl(220 13% 91%);
        --muted: hsl(210 10% 94.1%);
        --muted-foreground: hsl(215.4 16.3% 46.9%);
        --border: hsl(220 13% 91%);
        --sidebar-background: hsl(0 0% 98%);
        --sidebar-foreground: hsl(240 5.3% 26.1%);
        --sidebar-border: hsl(220 13% 91%);
        --radius: 0.75rem;
        --shimmer-base: hsl(210 10% 94.1%);
        --shimmer-hi: hsl(0 0% 100%);
        --header-bg: hsl(0 0% 97%);
        --card-bg: hsl(0 0% 99%);
        --item-active: hsl(210 10% 91%);
        --footer-row: hsl(210 10% 92%);
      }

      .dark {
        --background: hsl(240 10% 3.9%);
        --foreground: hsl(0 0% 98%);
        --card: hsl(240 10% 3.9%);
        --card-border: hsl(240 3.7% 15.9%);
        --muted: hsl(240 3.7% 15.9%);
        --muted-foreground: hsl(240 5% 64.9%);
        --border: hsl(240 3.7% 15.9%);
        --sidebar-background: hsl(240 5.9% 10%);
        --sidebar-foreground: hsl(240 4.8% 95.9%);
        --sidebar-border: hsl(240 3.7% 15.9%);
        --shimmer-base: hsl(240 3.7% 15.9%);
        --shimmer-hi: hsl(240 4.8% 22%);
        --header-bg: hsl(240 6% 8%);
        --card-bg: hsl(240 6% 7%);
        --item-active: hsl(240 3.7% 19%);
        --footer-row: hsl(240 3.7% 18%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100%;
        overflow: hidden;
        background: transparent !important;
      }

      #root {
        display: flex;
        height: calc(100vh - 2px);
        width: calc(100vw - 2px);
        margin: 1px;
        overflow: hidden;
        background-color: var(--background);
        border-radius: 12px;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
        color: var(--foreground);
      }

      .dark #root {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .maximized #root {
        height: 100vh;
        width: 100vw;
        margin: 0;
        border-radius: 0 !important;
        box-shadow: none !important;
      }

      .skeleton-sidebar {
        width: 256px;
        height: 100%;
        border-right: 1px solid var(--sidebar-border);
        background-color: var(--sidebar-background);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .skeleton-main {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .skeleton-header {
        height: 48px;
        border-bottom: 1px solid var(--border);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        gap: 8px;
        background-color: var(--header-bg);
      }

      .skeleton-header-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }

      .skeleton-content {
        padding: 32px;
        flex: 1;
        overflow: hidden;
      }

      .skeleton-box,
      .sk {
        position: relative;
        overflow: hidden;
        background-color: var(--shimmer-base);
        border-radius: 0.5rem;
      }

      .skeleton-box::after,
      .sk::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent 0%, var(--shimmer-hi) 50%, transparent 100%);
        animation: shimmer 1.6s infinite;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      .sidebar-header {
        padding: 24px;
        border-bottom: 1px solid var(--sidebar-border);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .sidebar-logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--shimmer-base);
        flex-shrink: 0;
      }

      .sidebar-nav {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .sidebar-item {
        height: 36px;
        width: 100%;
        border-radius: 8px;
        background-color: transparent;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
      }

      .sidebar-item.active {
        background-color: var(--item-active);
      }

      .sidebar-item-dot {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background-color: var(--shimmer-base);
        flex-shrink: 0;
        opacity: 0.55;
      }

      .sidebar-item-bar {
        height: 10px;
        width: 110px;
        border-radius: 5px;
        background-color: var(--shimmer-base);
        opacity: 0.45;
      }

      .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--sidebar-border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar-footer-row {
        height: 34px;
        border-radius: 8px;
        background-color: var(--footer-row);
      }

      .skeleton-card {
        border: 1px solid var(--card-border);
        background-color: var(--card-bg);
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .mb-2 {
        margin-bottom: 8px;
      }
      .mb-4 {
        margin-bottom: 16px;
      }
      .mb-6 {
        margin-bottom: 24px;
      }
      .w-6 {
        width: 24px;
      }
      .w-8 {
        width: 32px;
      }
      .w-12 {
        width: 48px;
      }
      .w-16 {
        width: 64px;
      }
      .w-20 {

      }
      .w-24 {
        width: 96px;
      }
      .w-28 {
        width: 112px;
      }
      .w-32 {
        width: 128px;
      }
      .w-40 {
        width: 160px;
      }
      .w-48 {
        width: 192px;
      }
      .w-64 {
        width: 256px;
      }
      .h-4 {
        height: 16px;
      }
      .h-5 {
        height: 20px;
      }
      .h-6 {
        height: 24px;
      }
      .h-8 {
        height: 32px;
      }
      .h-10 {

      }
      .h-12 {
        height: 48px;
      }
      .h-24 {
        height: 96px;
      }
      .h-48 {
        height: 192px;
      }
      .h-64 {
        height: 256px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 24px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .statcard-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .statcard-title {
        height: 10px;
        width: 72px;
        border-radius: 5px;
      }
      .statcard-icon {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        opacity: 0.5;
      }
      .statcard-value {
        height: 30px;
        width: 56px;
        border-radius: 7px;
      }
      .statcard-sub {
        height: 10px;
        width: 120px;
        border-radius: 5px;
        margin-top: 10px;
        opacity: 0.6;
      }
      .statcard-spark {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 44px;
        opacity: 0.22;
        padding: 0 4px;
      }

      .spark-line {
        width: 100%;
        height: 100%;
        display: block;
      }

      .spark-line polyline {
        fill: none;
        stroke: var(--shimmer-base);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }

      .donut {
        width: 176px;
        height: 176px;
        border-radius: 50%;
        margin: 0 auto;
        border: 26px solid var(--shimmer-base);
        border-right-color: var(--item-active);
        border-bottom-color: var(--item-active);
        position: relative;
      }
    </style>
    <script>
      (function () {
        try {

          const supportDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches === true;
          if (theme === "dark" || (!theme && supportDarkMode)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
